server:
  port: 15000
  ssl:
    enabled: false
    key-store: classpath:certs/server.p12
    key-store-password: ai-ops-password
    key-store-type: PKCS12
    key-alias: server
    trust-store: classpath:certs/truststore.p12
    trust-store-password: ai-ops-password
    trust-store-type: PKCS12
    client-auth: need

spring:
  application:
    name: DevOpsDashboard
  
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: PT1H
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/devops_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always