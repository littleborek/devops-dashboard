<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DevOps Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(75, 85, 99, 0.3);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-gray-100 flex items-center justify-center min-h-screen font-sans">
    
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/10 rounded-full blur-[120px]"></div>
    </div>

    <div class="w-full max-w-md p-8 glass rounded-2xl shadow-2xl z-10 fade-in">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-blue-400 flex justify-center items-center mb-2">
                <i class="fa-solid fa-server mr-3"></i>
                DevOps<span class="text-white">Dashboard</span>
            </h1>
            <p class="text-gray-400 text-sm">Altyapını yönetmeye başlamak için giriş yap</p>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-6">
            <div th:if="${param.error}" class="bg-red-900/40 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg text-sm mb-4">
                <i class="fa-solid fa-circle-exclamation mr-2"></i> Geçersiz kullanıcı adı veya şifre.
            </div>
            
            <div th:if="${param.logout}" class="bg-blue-900/40 border border-blue-500/50 text-blue-200 px-4 py-3 rounded-lg text-sm mb-4">
                <i class="fa-solid fa-circle-info mr-2"></i> Başarıyla çıkış yapıldı.
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-2 ml-1">Kullanıcı Adı</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required 
                        class="w-full bg-gray-900/50 border border-gray-700 rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none text-gray-100"
                        placeholder="admin">
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-2 ml-1">Şifre</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required 
                        class="w-full bg-gray-900/50 border border-gray-700 rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none text-gray-100"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/20 transform transition hover:-translate-y-0.5 active:scale-95">
                Giriş Yap
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-800 text-center">
            <p class="text-xs text-gray-500">
                &copy; 2026 DevOps Dashboard. Tüm hakları saklıdır.
            </p>
        </div>
    </div>
</body>
</html>
