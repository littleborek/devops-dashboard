name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. AŞAMA: CI (Continuous Integration) — Kalite & Hata Kontrolü
  # ─────────────────────────────────────────────────────────────
  ci-test:
    name: CI - Build & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build Java & Frontend (Maven)
        run: ./mvnw clean package -DskipTests

      - name: Install & Verify Python AI Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          python -m py_compile ai-service/app.py ai-service/agents/devops_crew.py ai-service/orchestrator/main_graph.py

  # ─────────────────────────────────────────────────────────────
  # 2. AŞAMA: CD (Continuous Deployment) — Dockerize & GHCR Push
  # ─────────────────────────────────────────────────────────────
  cd-build-and-push:
    name: CD - Build Docker Image & Push to GHCR
    needs: ci-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
